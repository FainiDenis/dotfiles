[rule.condition]
extensions = [
    "json",
    "yaml",
    "yml",
    "toml",
    "xml",
    "sql",
    "sh",
    "zsh",
    "bash",
    "py",
    "js",
    "ts",
    "jsx",
    "tsx",
    "go",
    "rs",
    "java",
    "c",
    "cpp",
    "h",
    "hpp",
]

[rule.action]
type = "move"
destination = "/Users/fainidenis/Downloads/Code"
