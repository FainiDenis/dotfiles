[[rule]]
name = "Applications: .app Bundles"
enabled = true
stop_processing = false

[rule.condition]
extension = "app"
extensions = []

[rule.action]
type = "move"
destination = "/Users/fainidenis/Applications"
create_destination = true
overwrite = false

[[rule]]
name = "Desktop: Screenshots"
enabled = true
stop_processing = false

[rule.condition]
extensions = []
name_matches = "Screenshot*.png"

[rule.action]
type = "move"
destination = "/Users/fainidenis/Pictures/Screenshots"
create_destination = true
overwrite = false

[[rule]]
name = "Cleanup: Old Temporary Files"
enabled = true
stop_processing = false

[rule.condition]
extensions = [
    "tmp",
    "log",
    "bak",
]
age_days_greater_than = 30

[rule.action]
type = "trash"
