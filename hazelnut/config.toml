[general]
log_level = "info"
log_file = "/Users/fainidenis/.config/hazelnut/hazelnut.log"
debounce_seconds = 2
polling_interval_secs = 5
log_retention = 1000
start_daemon_on_launch = false
notifications_enabled = true
theme = "cyberpunk"

[[watch]]
path = "/Users/fainidenis/Downloads"
recursive = false
rules = []

[[watch]]
path = "/Users/fainidenis/Desktop"
recursive = false
rules = []

[[rule]]
name = "Downloads: Documents"
enabled = true
stop_processing = false

[rule.condition]
extensions = [
    "pdf",
    "docx",
    "xlsx",
    "pptx",
    "txt",
    "odt",
    "ods",
    "odp",
    "rtf",
    "md",
    "tex",
    "csv",
]

[rule.action]
type = "move"
destination = "/Users/fainidenis/Downloads/Documents"
create_destination = true
overwrite = false

[[rule]]
name = "Downloads: Images"
enabled = true
stop_processing = false

[rule.condition]
extensions = [
    "jpg",
    "jpeg",
    "png",
    "gif",
    "bmp",
    "webp",
    "heic",
    "tiff",
    "svg",
]

[rule.action]
type = "move"
destination = "/Users/fainidenis/Downloads/Images"
create_destination = true
overwrite = false

[[rule]]
